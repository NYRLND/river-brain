name: Hourly update

on:
  schedule:
    # Primary trigger is external: cron-job.org calls the workflow_dispatch API at :00 and :30
    # (GitHub's scheduler never fired for this repo in its first hours). This schedule is kept
    # as a backup; an extra run is harmless (same data, archive skips duplicates).
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # push the forecast archive branch
  pages: write
  id-token: write

# The data job and the deploy job have separate concurrency groups. The deploy job passes the
# github-pages environment gate, and a job waiting there ignores timeout-minutes (GitHub lets it
# wait up to 30 days). On 2026-09-30 one run hung at that gate for 9 days. Under a single
# workflow-wide group it held the lock, so every later run was queued and then cancelled. Now
# the data job never waits on the gate, and a newer deploy cancels an older one.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: hourly-build
      cancel-in-progress: false   # don't kill a run mid-way through pushing the archive
    steps:
      - uses: actions/checkout@v5

      - name: Check out forecast archive (orphan branch 'archive')
        run: |
          if git fetch --depth=1 origin archive:archive; then
            git worktree add archive archive
          else
            git worktree add --orphan -b archive archive
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-prod.txt

      - run: pip install -r requirements-prod.txt

      - name: Fetch data, apply model, write JSON
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}   # optional; raises the USGS rate limit
        run: python -m riverbrain.run --out site/data --archive-dir archive

      - name: Commit forecast archive
        continue-on-error: true   # never block the deploy on the archive
        working-directory: archive
        run: |
          git config user.name "river-brain-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -qm "archive $(date -u +%FT%H)" && git push -q origin archive; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: true    # the newest data wins; also unsticks a hung environment gate
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
