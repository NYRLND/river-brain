name: Hourly update

on:
  schedule:
    # Twice an hour: GitHub's scheduler is best-effort and can skip or delay runs, so a second
    # slot keeps data fresh. Off-peak minutes (not :00). A re-run within the same hour is harmless.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # push the forecast archive branch
  pages: write
  id-token: write

concurrency:
  group: hourly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Check out forecast archive (orphan branch 'archive')
        run: |
          if git fetch --depth=1 origin archive:archive; then
            git worktree add archive archive
          else
            git worktree add --orphan -b archive archive
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-prod.txt

      - run: pip install -r requirements-prod.txt

      - name: Fetch data, apply model, write JSON
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}   # optional; raises the USGS rate limit
        run: python -m riverbrain.run --out site/data --archive-dir archive

      - name: Commit forecast archive
        continue-on-error: true   # never block the deploy on the archive
        working-directory: archive
        run: |
          git config user.name "river-brain-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -qm "archive $(date -u +%FT%H)" && git push -q origin archive; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
